<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan 3D de la Clinique — La Maison Africaine du Médecin</title>
  <style>
    :root { --navy:#071422; --navy2:#0b1e30; --cyan:#00c8ee; --cyan2:#5ee7ff; --line:rgba(0,200,238,.22); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: var(--navy); color: #eaf6fb; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; }
    .ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .top {
      position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 22px; background: linear-gradient(180deg, rgba(7,20,34,.94) 0%, rgba(7,20,34,0) 100%); pointer-events: auto;
    }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
    .brand p { font-size: 12px; color: #8ecfe3; margin-top: 3px; }
    .btns { display: flex; gap: 10px; }
    .btn {
      color: #cfeef7; text-decoration: none; font-size: 12.5px; padding: 9px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(11,30,48,.65); backdrop-filter: blur(6px); cursor: pointer;
      transition: all .18s; font-family: inherit;
    }
    .btn:hover { border-color: rgba(0,200,238,.45); background: rgba(0,200,238,.12); color: #fff; }
    .btn.primary { background: rgba(0,200,238,.14); border-color: rgba(0,200,238,.4); color: var(--cyan2); }
    .legend {
      position: absolute; left: 18px; bottom: 18px; width: 260px;
      background: rgba(8,22,36,.86); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px;
      backdrop-filter: blur(8px); pointer-events: auto;
    }
    .legend h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #8ecfe3; margin-bottom: 10px; }
    .leg-item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; font-size: 12.5px; color: #d8eef5; cursor: pointer; border-radius: 8px; }
    .leg-item:hover { background: rgba(255,255,255,.04); }
    .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,.06) inset; }
    .hint {
      position: absolute; right: 18px; bottom: 18px; font-size: 11.5px; color: #7fb8cc;
      background: rgba(8,22,36,.72); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      backdrop-filter: blur(6px); line-height: 1.5;
    }
    .room-info {
      position: absolute; top: 78px; left: 50%; transform: translateX(-50%);
      background: rgba(8,22,36,.88); border: 1px solid rgba(0,200,238,.35); border-radius: 14px;
      padding: 12px 18px; text-align: center; min-width: 300px; backdrop-filter: blur(8px);
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .room-info.show { opacity: 1; }
    .room-info .n { color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .room-info .t { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .room-info .d { font-size: 12.5px; color: #9ecbdd; margin-top: 3px; }
    .loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      background: var(--navy); z-index: 100; color: #8ecfe3;
    }
    .loading.hidden { display: none; }
    .spin { width: 34px; height: 34px; border: 3px solid rgba(0,200,238,.18); border-top-color: var(--cyan); border-radius: 50%; animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="loading" id="loading"><div class="spin"></div><div>Génération du plan 3D…</div></div>
  <div class="ui">
    <div class="top">
      <div class="brand">
        <h1>Plan 3D de la Clinique</h1>
        <p>La Maison Africaine du Médecin — Vue architecturale</p>
      </div>
      <div class="btns">
        <button class="btn primary" id="btnReset">Vue d'ensemble</button>
        <button class="btn" id="btnTop">Vue de dessus</button>
        <button class="btn" id="btnWalk">Visite parcours</button>
        <a class="btn" href="index.html">← Salles détaillées</a>
      </div>
    </div>
    <div class="room-info" id="roomInfo">
      <div class="n" id="riNum"></div>
      <div class="t" id="riTitle"></div>
      <div class="d" id="riDesc"></div>
    </div>
    <div class="legend" id="legend">
      <h3>Services</h3>
    </div>
    <div class="hint">Clic gauche + glisser : tourner<br>Molette : zoom<br>Survol : infos salle</div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="js/clinique.js?v=20261106a"></script>
</body>
</html>
